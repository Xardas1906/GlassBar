# Neue Version an winget melden: Sobald ein Release veröffentlicht ist (kein Entwurf, keine Vorabversion),
# erstellt diese Aktion über den Fork Xardas1906/winget-pkgs einen Pull Request bei microsoft/winget-pkgs.
# Braucht das Repository-Secret WINGET_TOKEN (klassisches GitHub-Token mit Recht „public_repo“).
# Die Aktion kann nur Versionen zu einem Paket nachreichen, das schon in winget steht. Solange die erste
# Einreichung (1.4.4, von Hand) noch nicht freigegeben ist, gibt sie nur einen Hinweis aus; danach eine
# übersprungene Version über „Run workflow“ mit ihrem Tag nachreichen.
name: winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag (z. B. v1.4.5)
        required: true

jobs:
  publish:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Voraussetzungen prüfen
        id: check
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            "::warning::Secret WINGET_TOKEN fehlt – die Version wird nicht an winget gemeldet."
            "ready=false" >> $env:GITHUB_OUTPUT; exit 0
          }
          gh api repos/microsoft/winget-pkgs/contents/manifests/x/Xardas1906/GlassBar --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            "::warning::Xardas1906.GlassBar steht noch nicht in winget (erste Einreichung wartet auf Freigabe). Nach der Freigabe diesen Workflow mit dem Tag erneut starten."
            "ready=false" >> $env:GITHUB_OUTPUT; exit 0
          }
          "ready=true" >> $env:GITHUB_OUTPUT

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.check.outputs.ready == 'true'
        with:
          identifier: Xardas1906.GlassBar
          installers-regex: 'GlassBar-Setup-.*\.exe$'
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
